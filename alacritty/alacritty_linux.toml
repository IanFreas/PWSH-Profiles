[terminal.shell]
program = "zellij"

[font]
size = 14.0 # Gohu is designed for specific sizes (usually 11 or 14)

[font.normal]
family = "GohuFont uni14 Nerd Font" # Or uni14
style = "Regular"

[font.glyph_offset]
x = 0
y = 0

# Adjust these if characters are too far apart or overlapping
[font.offset]
x = 0
y = 0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
